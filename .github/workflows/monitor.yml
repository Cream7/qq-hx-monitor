name: QQ华夏 充值活动监控

on:
  schedule:
    # 每 10 分钟跑一次（GitHub schedule 半夜可能延迟，但高频跑总比低频强）
    - cron: "*/10 * * * *"
  workflow_dispatch: {}  # 允许手动触发

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/monitor.py') }}

      - name: 安装 Playwright
        run: |
          pip install playwright
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            playwright install chromium --with-deps
          else
            playwright install chromium
          fi

      - name: 运行监控脚本
        env:
          # ===== 推送渠道（至少配一个）=====
          # Server酱 Turbo：https://sct.ftqq.com/  微信推送
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          # 企业微信群机器人 webhook 地址
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          # Bark (iOS)：https://bark.day.app/
          BARK_KEY: ${{ secrets.BARK_KEY }}
          # Telegram Bot
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python monitor.py

      - name: 提交状态文件
        run: |
          git config user.name "hx-monitor-bot"
          git config user.email "hx-monitor-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "chore: update state [skip ci]"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
